name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag and package version differ.' }
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project backend --group build --locked
      - name: Verify public source and tests
        run: |
          uv run --project backend python scripts\check-publication.py
          bun run typecheck
          bun test src\shared
          uv run --project backend python -m unittest discover -s backend -p "test_*.py" -q
      - name: Build and package
        run: |
          bun run build:release
          powershell -NoProfile -File scripts\release-assets.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          path: |
            artifacts/keyloom-*-windows-x64*
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Keyloom $GITHUB_REF_NAME"
