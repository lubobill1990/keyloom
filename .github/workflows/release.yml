name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
    with:
      artifact_prefix: release

  sign:
    needs: platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Sign all five version-bound platform feeds
        env:
          KEYLOOM_UPDATE_SIGNING_KEY: ${{ secrets.KEYLOOM_UPDATE_SIGNING_KEY }}
        run: bun scripts/update-release.ts sign --directory release --version "$GITHUB_REF_NAME" --all-platforms
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release-all-platforms
          path: release/*
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release-all-platforms
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Keyloom $GITHUB_REF_NAME"
