name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project backend --group build --locked
      - name: Guard public source
        run: uv run --project backend python scripts\check-publication.py
      - name: Type-check and frontend state-machine tests
        run: |
          bun run typecheck
          bun test src\shared
      - name: Core, IPC, CLI and Git backup tests
        run: uv run --project backend python -m unittest discover -s backend -p "test_*.py" -q
      - name: Build Windows distribution
        run: bun run build:release
      - name: Package release assets
        run: powershell -NoProfile -File scripts\release-assets.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keyloom-windows-x64
          path: |
            artifacts/keyloom-*-windows-x64*
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
