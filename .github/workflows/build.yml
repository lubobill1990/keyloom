name: Native platform validation

on:
  workflow_call:
    inputs:
      artifact_prefix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      KEYLOOM_EXPECT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libsecret-1-0 gnome-keyring dbus-x11 xvfb xauth zstd libasound2t64 libgbm1 fonts-noto-cjk zenity
      - name: Prepare isolated macOS CI keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p keyloom-ci-synthetic-keyring "$RUNNER_TEMP/keyloom-ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/keyloom-ci.keychain-db"
          security unlock-keychain -p keyloom-ci-synthetic-keyring "$RUNNER_TEMP/keyloom-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/keyloom-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/keyloom-ci.keychain-db"
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
      - name: Test, build, package and run the actual native desktop
        run: bun scripts/ci-check.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.target }}
          path: |
            artifacts/keyloom-*
            artifacts/latest*.unsigned.json
          if-no-files-found: error
      - name: Remove isolated macOS CI keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/keyloom-ci.keychain-db"
